spring.application.name=nexodesk-api
server.port=8080

# Banco de desenvolvimento: H2 em arquivo, modo MySQL (nada para instalar).
# Para MySQL, rode com --spring.profiles.active=mysql (veja application-mysql.properties).
spring.datasource.url=jdbc:h2:file:./data/nexodesk;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# O esquema vem do schema.sql; o Hibernate só confere se as entidades batem com ele.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Upload de imagem do chamado
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
nexodesk.uploads.dir=uploads

# Serviço Python de prioridade (RF02). Se estiver fora do ar, o Java classifica só pela categoria.
nexodesk.prioridade.url=http://localhost:8001
nexodesk.prioridade.timeout-ms=2000

# Síndico inicial, criado só se ainda não existir nenhum.
# Se a senha ficar vazia, uma senha aleatória é gerada e mostrada UMA vez no console.
# \u00ED = i com acento agudo (este .properties é lido como ISO-8859-1; acento direto vira lixo na tela)
nexodesk.sindico.nome=S\u00EDndico
nexodesk.sindico.email=sindico@nexodesk.local
nexodesk.sindico.senha=

# Aviso por e-mail (RF05). Padrão: DESLIGADO, nada sai da máquina (só um registro no log).
# Para ligar use o perfil "email" (veja application-email.properties): --spring.profiles.active=email
nexodesk.email.enabled=false
nexodesk.email.remetente=nexodesk@localhost
nexodesk.url-publica=http://localhost:8080

# Cookie de sessão
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
