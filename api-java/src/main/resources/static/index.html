<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexoDesk - Entrar</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="login">
    <div class="marca-grande">Nexo<span>Desk</span></div>
    <div class="cartao">
      <p class="muted">Chamados do seu condomínio em um só lugar: abra, acompanhe e receba avisos.</p>

      <div class="abas" role="tablist">
        <button type="button" id="aba-entrar" class="ativa" role="tab">Entrar</button>
        <button type="button" id="aba-cadastrar" role="tab">Criar conta</button>
      </div>

      <div id="mensagem" class="mensagem hidden" role="alert"></div>

      <form id="form-entrar">
        <label for="login-email">E-mail</label>
        <input id="login-email" type="email" autocomplete="username" required>
        <label for="login-senha">Senha</label>
        <input id="login-senha" type="password" autocomplete="current-password" required>
        <div class="acoes"><button type="submit">Entrar</button></div>
      </form>

      <form id="form-cadastrar" class="hidden">
        <label for="cad-nome">Nome</label>
        <input id="cad-nome" type="text" autocomplete="name" maxlength="120" required>
        <label for="cad-email">E-mail</label>
        <input id="cad-email" type="email" autocomplete="email" maxlength="160" required>
        <label for="cad-unidade">Unidade (bloco e apartamento)</label>
        <input id="cad-unidade" type="text" maxlength="40" placeholder="Ex.: Bloco A, 101">
        <label for="cad-telefone">Telefone (opcional)</label>
        <input id="cad-telefone" type="tel" autocomplete="tel" maxlength="20">
        <label for="cad-senha">Senha (mínimo 8 caracteres)</label>
        <input id="cad-senha" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
        <div class="acoes"><button type="submit">Criar conta</button></div>
      </form>
    </div>
  </main>
  <script src="/js/app.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
