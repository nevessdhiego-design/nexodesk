<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexoDesk - Painel do síndico</title>
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/acessibilidade.css">
  <script src="/js/acessibilidade.js"></script>
</head>
<body>
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo">
    <div class="marca">Nexo<span>Desk</span></div>
    <div class="espaco"></div>
    <span class="usuario" id="usuario"></span>
    <button type="button" class="secundario sino" id="botao-sino" aria-label="Notificações">
      Avisos <span class="contador hidden" id="contador"></span>
    </button>
    <button type="button" class="secundario" id="botao-sair">Sair</button>
  </header>
  <nav id="menu" class="menu nao-imprimir" aria-label="Menu principal"></nav>

  <main class="pagina" id="conteudo" tabindex="-1">
    <h1 class="somente-leitor">Painel do síndico</h1>
    <section class="cartao hidden" id="painel-avisos" aria-live="polite">
      <h2>Avisos</h2>
      <div id="lista-avisos"></div>
    </section>

    <section class="estatisticas" id="estatisticas" aria-label="Resumo"></section>
    <section class="cartao graficos" id="graficos" aria-label="Distribuição dos chamados"></section>

    <section class="cartao">
      <h2>Fila de chamados</h2>
      <p class="muted"><strong>Emergências primeiro</strong>; depois do mais fácil ao mais difícil de resolver. Chamado difícil que espera muito sobe na fila (1 ponto a cada 2 dias, até 3), para ninguém ser esquecido.</p>
      <div class="filtros">
        <div><label for="filtro">Mostrar</label>
        <select id="filtro">
        <option value="ativos">Pendentes (abertos e em andamento)</option>
        <option value="todos">Todos</option>
        <option value="ABERTO">Só abertos</option>
        <option value="EM_ANDAMENTO">Só em andamento</option>
        <option value="RESOLVIDO">Só resolvidos</option>
        </select>
        </div>
        <div><label for="busca">Buscar (título, descrição, morador ou local)</label>
        <input id="busca" type="text" maxlength="120" autocomplete="off"></div>
        <div><label for="filtro-categoria">Categoria</label>
        <select id="filtro-categoria"><option value="">Todas as categorias</option></select></div>
      </div>
      <p class="muted" id="contagem" role="status"></p>
      <p><a class="botao-link escuro" id="exportar" href="/api/sindico/chamados/exportar.csv" download>Exportar esta lista (CSV)</a></p>
      <div id="mensagem" class="mensagem hidden" role="alert"></div>
      <div id="novidades" class="mensagem ok hidden" role="status">
        Há novidades. <button type="button" class="link" id="atualizar-agora">Atualizar agora</button>
      </div>
      <div id="lista-chamados" aria-busy="true"><div class="esqueleto" aria-hidden="true"></div><div class="esqueleto" aria-hidden="true"></div></div>
    </section>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/avisos.js"></script>
  <script src="/js/tempo-real.js"></script>
  <script src="/js/conversa.js"></script>
  <script src="/js/sindico.js"></script>
</body>
</html>
