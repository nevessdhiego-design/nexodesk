# Perfil "mysql". Credenciais SEMPRE por variável de ambiente, nunca neste arquivo.
#   NEXODESK_DB_URL    ex.: jdbc:mysql://localhost:3306/nexodesk?serverTimezone=America/Sao_Paulo
#   NEXODESK_DB_USUARIO
#   NEXODESK_DB_SENHA
# Crie o banco antes:  CREATE DATABASE nexodesk CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# As migrações do Flyway (db/migration) rodam sozinhas na inicialização.
spring.datasource.url=${NEXODESK_DB_URL}
spring.datasource.username=${NEXODESK_DB_USUARIO}
spring.datasource.password=${NEXODESK_DB_SENHA}
# validate: o Hibernate confere se as entidades batem com as tabelas e recusa subir se não baterem.
# (Testado no MySQL 8.4.9: suíte completa passou com esta conferência ligada.)
spring.jpa.hibernate.ddl-auto=validate
