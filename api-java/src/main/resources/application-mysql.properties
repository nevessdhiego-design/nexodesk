# Perfil "mysql". Credenciais SEMPRE por variável de ambiente, nunca neste arquivo.
#   NEXODESK_DB_URL    ex.: jdbc:mysql://localhost:3306/nexodesk?useSSL=false&serverTimezone=America/Sao_Paulo
#   NEXODESK_DB_USUARIO
#   NEXODESK_DB_SENHA
spring.datasource.url=${NEXODESK_DB_URL}
spring.datasource.username=${NEXODESK_DB_USUARIO}
spring.datasource.password=${NEXODESK_DB_SENHA}
# A conferência do Hibernate é feita nos testes com H2; no MySQL basta rodar o schema.sql.
spring.jpa.hibernate.ddl-auto=none
