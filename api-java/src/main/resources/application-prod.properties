# Perfil "prod": para publicar fora do localhost, ATRÁS DE HTTPS (proxy reverso como nginx, Caddy ou o do provedor).
# Combine com os outros perfis, ex.: --spring.profiles.active=prod,mysql
#
# O que muda em relação ao desenvolvimento:
#  - o cookie de sessão só trafega por HTTPS (atributo Secure); sem HTTPS o login não "gruda";
#  - confia nos cabeçalhos X-Forwarded-* do proxy (assim a API sabe que a conexão original era HTTPS);
#  - o cabeçalho HSTS (Strict-Transport-Security) já é enviado pelo Spring Security em conexões HTTPS;
#  - sessão expira em 2 horas sem uso;
#  - o endereço público é obrigatório (vai nos e-mails): variável NEXODESK_URL_PUBLICA.
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=2h
server.forward-headers-strategy=framework
nexodesk.url-publica=${NEXODESK_URL_PUBLICA}
