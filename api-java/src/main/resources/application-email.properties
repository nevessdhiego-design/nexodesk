# Perfil "email": liga o envio REAL de e-mail quando o síndico muda o status de um chamado.
# Credenciais SEMPRE por variável de ambiente, nunca neste arquivo:
#   NEXODESK_SMTP_HOST        ex.: smtp.gmail.com
#   NEXODESK_SMTP_PORTA       ex.: 587
#   NEXODESK_SMTP_USUARIO
#   NEXODESK_SMTP_SENHA       (no Gmail, use uma "senha de app", não a senha da conta)
#   NEXODESK_EMAIL_REMETENTE  ex.: nexodesk@seudominio.com
#   NEXODESK_URL_PUBLICA      endereço que vai no corpo do e-mail
# Combine com outros perfis, ex.: --spring.profiles.active=mysql,email
nexodesk.email.enabled=true
nexodesk.email.remetente=${NEXODESK_EMAIL_REMETENTE}
nexodesk.url-publica=${NEXODESK_URL_PUBLICA:http://localhost:8080}
spring.mail.host=${NEXODESK_SMTP_HOST}
spring.mail.port=${NEXODESK_SMTP_PORTA:587}
spring.mail.username=${NEXODESK_SMTP_USUARIO}
spring.mail.password=${NEXODESK_SMTP_SENHA}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
