# Configuração só dos testes: banco em memória, upload em target/, serviço Python inexistente
# (porta 9 recusa conexão, então o Java usa a classificação de reserva).
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
nexodesk.uploads.dir=target/test-uploads
nexodesk.prioridade.url=http://localhost:9
nexodesk.prioridade.timeout-ms=500
nexodesk.sindico.nome=S\u00EDndico de Teste
nexodesk.sindico.email=sindico.teste@nexodesk.test
nexodesk.sindico.senha=Senha-Somente-Para-Testes-1
