# Perfil "test": só sobrescreve o que muda nos testes; o resto vem do application.properties principal
# (inclusive o Flyway e ddl-auto=validate, que fazem o Hibernate CONFERIR as migrações).
#
# Por padrão: H2 em memória, upload em target/ e serviço Python inexistente (porta 9 recusa conexão,
# então o Java usa a classificação de reserva).
# Para rodar a suíte contra um MySQL de verdade, defina antes (use um banco SÓ para teste):
#   NEXODESK_TEST_DB_URL, NEXODESK_TEST_DB_USUARIO, NEXODESK_TEST_DB_SENHA
spring.datasource.url=${NEXODESK_TEST_DB_URL:jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${NEXODESK_TEST_DB_USUARIO:sa}
spring.datasource.password=${NEXODESK_TEST_DB_SENHA:}
nexodesk.uploads.dir=target/test-uploads
nexodesk.prioridade.url=http://localhost:9
nexodesk.prioridade.timeout-ms=500
nexodesk.sindico.nome=S\u00EDndico de Teste
nexodesk.sindico.email=sindico.teste@nexodesk.test
nexodesk.sindico.senha=Senha-Somente-Para-Testes-1
